name: Hospital Queue CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2

      - name: Build backend with Maven
        run: |
          cd hospital-queue-backend
          mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          cd hospital-queue-backend
          docker build -t hospital-queue-backend:latest .

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Build frontend
        run: |
          cd hospital-queue-frontend
          npm install
          npm run build

      - name: Build frontend Docker image
        run: |
          cd hospital-queue-frontend
          docker build -t hospital-queue-frontend:latest .

      - name: Run health check
        run: |
          pip install requests
          python scripts/health-check.py || true
